<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALTIA · Gestión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: oficina de un estudio web; directa, colorida, eficiente — como un tablero de trabajo.
   IDEA: el tablero de producción tipo "work OS": filas por proyecto con pastillas de estado de color.
   PICTURE: el propio tablero (grupos de color, pastillas, avance) y el mapa de clientes de México/Michoacán.
   COLOUR and TYPE: barra lateral grafito-índigo, área blanca; azul de acción, estados verde/naranja/rojo/morado. Figtree.
   LAYOUT: barra lateral fija + barra superior; vistas en una columna con tablas, rejillas de calendario y planner. */
:root{color-scheme:light dark;
--bg:light-dark(#f4f5f9,#14172a);--pan:light-dark(#ffffff,#1e2238);--pan2:light-dark(#eef0f6,#272b45);
--ink:light-dark(#1c1f3b,#e9eaf4);--mute:light-dark(#5c6080,#a3a7c6);--line:light-dark(#e0e3ed,#343959);
--side:#22273f;--sideink:#d6d9ee;--blue:#0073ea;--green:#00a95c;--orange:#f39a1e;--red:#e2445c;--purple:#9d50dd;--grey:#8a8fa8;
--sea:light-dark(#dcecf9,#101d33);--land:light-dark(#fbfbfd,#262b47);--micf:light-dark(#fff0dc,#3a3550);--today:light-dark(#e7f0ff,#1c2a4f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
.scroll{overflow-x:auto}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--side);position:relative;overflow:hidden}
.login .deco{position:absolute;inset:0;width:100%;height:100%;opacity:.5}
.lcard{position:relative;background:var(--pan);border-radius:18px;padding:30px clamp(20px,4vw,36px);width:min(430px,100%);box-shadow:0 30px 80px #0007}
.lbrand{display:flex;align-items:center;gap:12px;font-size:34px;font-weight:800;line-height:1;letter-spacing:.02em}
.lcard p{color:var(--mute);margin:8px 0 22px}
.who{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.who label{display:flex;align-items:center;gap:10px;padding:12px;border:1.5px solid var(--line);border-radius:12px;font-weight:700;cursor:pointer;min-height:56px}
.who input{position:absolute;opacity:0;pointer-events:none}
.who label:has(input:checked){border-color:var(--blue);background:var(--today)}
.who label:has(input:focus-visible){outline:2px solid var(--blue)}
.lerr{color:var(--red);font-weight:600;min-height:22px;margin:8px 0 0;font-size:14px}
/* app */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--sideink);padding:16px 10px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;color:#fff;padding:4px 10px 18px;letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;color:inherit;text-decoration:none;font-weight:500;min-height:42px}
.nav a:hover{background:#ffffff12}.nav a.on{background:#ffffff24;color:#fff;font-weight:600}
.nav svg{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dbst{margin-top:auto;font-size:13px;padding:10px 12px;color:#b5b9d6;display:flex;gap:8px;align-items:flex-start}
.dbst i{width:9px;height:9px;border-radius:50%;background:var(--grey);flex:none;margin-top:6px}
.dbst.live i{background:#00c875}.dbst.warn i{background:var(--orange)}.dbst.err i{background:var(--red)}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px clamp(16px,3vw,30px);border-bottom:1px solid var(--line);background:var(--pan);position:sticky;top:0;z-index:5}
.top h1{font-size:24px;line-height:1.1;margin:0;flex:1 1 180px}
.search{min-height:40px;width:min(260px,100%);padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:16px}
.me{display:flex;align-items:center;gap:8px;font-weight:600}
.view{padding:20px clamp(16px,3vw,30px) 48px;max-width:1400px}
.hello{font-size:15px;color:var(--mute);margin:0 0 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--pan);font-weight:600;white-space:nowrap;text-decoration:none;color:inherit}
.btn:hover{border-color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.sm{min-height:34px;padding:0 10px;font-size:14px}
.btn.dan{color:var(--red)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--pan)}
.seg button{border:0;background:none;min-height:38px;padding:0 14px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--blue);color:#fff}
.bar-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.bar-row .grow{flex:1}
.sel{min-height:38px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--pan);font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--pan);border:1px solid var(--line);border-radius:12px;padding:14px 16px;border-top:4px solid var(--c,var(--blue))}
.kpi b{display:block;font-size:clamp(22px,2.6vw,30px);line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi span{color:var(--mute);font-size:14px}
.card{background:var(--pan);border:1px solid var(--line);border-radius:12px;padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:16px}
h2{font-size:17px;margin:0 0 10px;line-height:1.25}
.li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.li:first-of-type{border-top:0}
.li .t{flex:1}
.sub{font-size:13px;color:var(--mute)}
.empty{padding:26px;text-align:center;color:var(--mute);border:1.5px dashed var(--line);border-radius:12px;background:var(--pan)}
.note{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:10px;background:light-dark(#fff5e5,#3a2f1f);margin-bottom:14px;font-size:14.5px}
/* tablero */
.grp{margin-top:20px;--c:var(--grey)}
.grp h3{display:flex;align-items:center;gap:8px;font-size:17px;margin:0 0 8px;color:var(--c)}
.grp h3 small{color:var(--mute);font-weight:500;font-size:14px}
.tog{border:0;background:none;color:inherit;width:30px;height:30px;border-radius:6px;font-size:14px}
.tog:hover{background:var(--pan2)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--pan);border:1px solid var(--line);border-radius:10px}
.tbl th{font-size:13px;font-weight:600;color:var(--mute);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:hover td{background:var(--pan2)}
.tbl tr:last-child td{border-bottom:0}
.tbl td:first-child,.tbl th:first-child{border-left:6px solid var(--c);}
.tbl tr:first-child th:first-child{border-top-left-radius:9px}
.tbl tfoot td{padding:4px 10px}
.pj{table-layout:fixed;min-width:1020px}.pj th:nth-child(2){width:15%}.pj th:nth-child(3){width:62px}.pj th:nth-child(4),.pj th:nth-child(5){width:130px}.pj th:nth-child(6){width:96px}.pj th:nth-child(7),.pj th:nth-child(8){width:112px}.pj th:nth-child(9){width:150px}
.add{border:0;background:none;color:var(--mute);font-weight:600;min-height:36px;padding:0 4px}
.add:hover{color:var(--blue)}
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:108px;min-height:32px;padding:0 10px;border:0;border-radius:6px;background:var(--c);color:#fff;font-weight:600;font-size:13.5px;white-space:nowrap}
.pill.sm{min-width:0;min-height:24px;font-size:12.5px;padding:0 8px}
.av{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:700;font-size:13px;background:var(--c);flex:none}
.avb{border:0;background:none;padding:2px;border-radius:50%}
.prog{display:flex;align-items:center;gap:8px;min-width:120px}
.bar{flex:1;height:8px;background:var(--pan2);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--c,var(--green));border-radius:99px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.late{color:var(--red);font-weight:700}
.link{background:none;border:0;padding:3px 0;font-weight:600;text-align:left;color:inherit;font-size:15.5px}
.link:hover{color:var(--blue);text-decoration:underline}
a.ext{color:var(--blue);font-weight:600;text-decoration:none;white-space:nowrap}
.stackbar{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--pan2);margin:8px 0 10px}
.stackbar i{background:var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--mute)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:6px}
/* barras contables */
.mrow{display:grid;grid-template-columns:62px minmax(0,1fr) 108px;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.mbars{display:grid;gap:3px}
.mbars i{display:block;height:9px;border-radius:4px;background:var(--c)}
.mrow .num{font-size:13px}
/* calendario */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cal .dh{background:var(--pan2);padding:6px 8px;font-size:13px;font-weight:600;color:var(--mute)}
.cal .d{background:var(--pan);min-height:108px;padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer}
.cal .d:hover{background:var(--pan2)}
.cal .d.out{background:var(--bg)}.cal .d.out .n{opacity:.45}
.cal .d.today{background:var(--today)}
.cal .n{font-size:13px;font-weight:700;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none}
.cal .d.today .n{background:var(--blue);color:#fff}
.chip{display:block;width:100%;font-size:12.5px;line-height:1.35;padding:2px 6px;border-radius:5px;background:var(--c);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;text-align:left;font-weight:500}
.chip.done{opacity:.45;text-decoration:line-through}
.more{font-size:12px;color:var(--mute);font-weight:600}
/* planner */
.week{display:grid;grid-template-columns:repeat(7,minmax(138px,1fr));gap:10px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--pan2);border-radius:12px;padding:8px;min-height:300px;display:flex;flex-direction:column;gap:8px;border:2px solid transparent}
.col.today{background:var(--today);border-color:var(--blue)}
.col.drop{border:2px dashed var(--blue)}
.col h4{margin:0;display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
.col h4 small{color:var(--mute);font-weight:500}
.task{background:var(--pan);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:8px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start;cursor:grab;box-shadow:0 1px 2px #0000000d}
.task.done .tt{text-decoration:line-through;color:var(--mute)}
.task input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--green)}
.task .tt{font-weight:600;font-size:14px;line-height:1.3;hyphens:auto;overflow-wrap:anywhere;background:none;border:0;padding:0;text-align:left}
.task .av{width:22px;height:22px;font-size:11px}.task .tm{display:flex;gap:6px;align-items:center;margin-top:4px}.task .tm .sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.backlog{margin-top:16px}
.backlog .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;background:var(--pan2);border-radius:12px;padding:10px;min-height:70px;border:2px solid transparent}
.backlog .list.drop{border:2px dashed var(--blue)}
/* mapa */
.mapgrid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px}
.mapbox{position:relative;height:min(72vh,660px);min-height:400px;background:var(--sea);border:1px solid var(--line);border-radius:12px;overflow:hidden;touch-action:none}
.mapbox svg{position:absolute;inset:0;width:100%;height:100%;cursor:grab;user-select:none}
.mapbox.pick svg{cursor:crosshair}
.st{fill:var(--land);stroke:light-dark(#aab1c8,#4d5480);stroke-width:1;vector-effect:non-scaling-stroke}
.st.mic{fill:var(--micf)}
.mus{display:none}svg.z .mus{display:inline}
.mu{fill:transparent;stroke:light-dark(#e1a868,#7f6c58);stroke-width:.7;vector-effect:non-scaling-stroke}
.mu.mor{fill:light-dark(#ffd9a8,#57463e)}
.cl text{fill:var(--mute);font-weight:600;paint-order:stroke;stroke:var(--land);stroke-linejoin:round}
.cl circle{fill:var(--mute)}
.pin{cursor:pointer}
.pin text{font-size:12.5px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:4px;stroke-linejoin:round}
.mapctl{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:42px;height:42px;border-radius:8px;border:1px solid var(--line);background:var(--pan);font-size:20px;font-weight:700}
.presets{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;right:62px}
.presets button{min-height:36px}
.pickbar{position:absolute;left:10px;right:10px;bottom:10px;background:var(--blue);color:#fff;border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:600}
.pickbar .btn{min-height:34px}
.mlist{display:flex;flex-direction:column;gap:10px;max-height:min(72vh,660px);overflow:auto}
.mitem{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--pan);text-align:left;width:100%}
.mitem.on{border-color:var(--red);box-shadow:0 0 0 2px var(--red) inset}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c,var(--red));flex:none}
/* modal y menú */
.ov{position:fixed;inset:0;background:#0b0e22a6;display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--pan);border-radius:14px;width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px 22px;box-shadow:0 24px 70px #0007}
.modal h2{font-size:21px;margin:0 0 14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:4px;font-size:13.5px;font-weight:600;color:var(--mute)}
.f input,.f select,.f textarea{font-size:16px;min-height:42px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-weight:400;width:100%}
.f textarea{min-height:80px;resize:vertical}
.f.chk{flex-direction:row;align-items:center;gap:10px;color:var(--ink);min-height:42px}
.f.chk input{width:20px;height:20px;min-height:0}
.f .help{font-weight:400;font-size:12.5px}
.coordrow{display:flex;gap:8px}.coordrow input{flex:1}
.mfoot{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:18px}
.mfoot div{display:flex;gap:10px}
.menu{position:fixed;z-index:60;background:var(--pan);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 12px 34px #0005;display:grid;gap:4px;min-width:150px}
.menu .pill{width:100%}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:70;max-width:calc(100% - 32px)}
textarea.csvout{width:100%;min-height:220px;font:13px/1.4 ui-monospace,Consolas,monospace;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
@media(max-width:900px){.mapgrid{grid-template-columns:1fr}.mlist{max-height:none}}
@media(max-width:860px){
 .app{grid-template-columns:1fr}
 .side{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;padding:6px 8px;z-index:10;gap:6px}
 .brand{padding:4px 8px;font-size:18px}.brand svg{width:26px;height:26px}
 .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none}
 .nav a{white-space:nowrap;padding:8px 10px;flex:none}
 .dbst{display:none}
 .top{position:static}
}
@media(max-width:600px){
 .nav a span{display:none}
 .form{grid-template-columns:1fr}
 .cal .d{min-height:58px;padding:4px}.cal .dh{padding:4px;font-size:12px}
 .chip{font-size:0;height:6px;padding:0}.more{font-size:10px}
 .week{grid-template-columns:1fr;overflow:visible}.col{min-height:0}
 table{font-size:14px}
 .stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}
 .stack td{display:flow-root;border:0!important;padding:3px 10px;padding-inline-start:8em;text-align:start}
 .stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;color:var(--mute);font-size:13px}
 .stack td:empty{display:none}
 .pj{min-width:0}
 .stack tfoot td{padding:6px 10px}.stack tfoot td::before{content:none}
 .stack tbody tr{border-left:6px solid var(--c)}
 .mrow{grid-template-columns:48px minmax(0,1fr) 92px}
}
@media(prefers-reduced-motion:no-preference){.modal{animation:pop .16s ease-out}@keyframes pop{from{transform:translateY(8px);opacity:0}}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>

<section id="login" class="login">
 <svg class="deco" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <g opacity=".9">
   <rect x="-40" y="90" width="520" height="40" rx="8" fill="#2f3556"/><rect x="380" y="96" width="110" height="28" rx="6" fill="#00a95c"/>
   <rect x="-40" y="146" width="520" height="40" rx="8" fill="#2f3556"/><rect x="380" y="152" width="110" height="28" rx="6" fill="#f39a1e"/>
   <rect x="-40" y="202" width="520" height="40" rx="8" fill="#2f3556"/><rect x="380" y="208" width="110" height="28" rx="6" fill="#e2445c"/>
   <rect x="760" y="560" width="520" height="40" rx="8" fill="#2f3556"/><rect x="800" y="566" width="110" height="28" rx="6" fill="#9d50dd"/>
   <rect x="760" y="616" width="520" height="40" rx="8" fill="#2f3556"/><rect x="800" y="622" width="110" height="28" rx="6" fill="#00a95c"/>
   <rect x="760" y="672" width="520" height="40" rx="8" fill="#2f3556"/><rect x="800" y="678" width="110" height="28" rx="6" fill="#0073ea"/>
  </g>
 </svg>
 <form class="lcard" id="lf" autocomplete="off">
  <div class="lbrand"><svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#0073ea"/><path d="M11 29 20 10l9 19M14.5 22h11" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>ALTIA</div>
  <p>Gestión de proyectos web. Elige tu usuario e ingresa tu contraseña.</p>
  <div class="who" role="radiogroup" aria-label="Usuario">
   <label><input type="radio" name="u" value="Fabiola" checked><span class="av" style="--c:#e2445c">F</span>Fabiola</label>
   <label><input type="radio" name="u" value="Ulises"><span class="av" style="--c:#0073ea">U</span>Ulises</label>
  </div>
  <label class="f" for="lp">Contraseña<input id="lp" type="password" autocomplete="current-password" required></label>
  <p class="lerr" id="lerr" role="alert"></p>
  <button class="btn pri" style="width:100%;min-height:46px;margin-top:6px" type="submit">Entrar</button>
 </form>

async function clearSample(){
 for(const col of COLS)for(const x of S.data[col].filter(y=>y.ejemplo)){await del(col,x.id);if(S.db)await new Promise(r=>setTimeout(r,90))}
 toast('Ejemplos borrados');
}

/* ---------- acciones ---------- */
const A={
 async logout(){try{if(chan){sb.removeChannel(chan);chan=null}await sb.auth.signOut()}catch(_){}S.user=null;for(const c of COLS)S.data[c]=[];$('#lp').value='';render()},
 new(el){const col=el.dataset.col,r={};
  if(col==='proyectos'){r.estado=el.dataset.estado||'Por iniciar';r.prioridad='Media';r.resp=S.user;r.avance=0;r.inicio=today()}
  if(col==='movimientos'){r.tipo=el.dataset.tipo||'Ingreso';r.pago=r.tipo==='Egreso'?'Pagado':'Pendiente';r.fecha=today().slice(0,7)===iso(S.acc).slice(0,7)?today():iso(S.acc).slice(0,8)+'01'}
  if(col==='eventos'){r.fecha=el.dataset.fecha||today();r.hi='10:00';r.hf='11:00'}
  if(col==='tareas'){r.fecha=el.dataset.fecha??'';r.resp=S.pf!=='Todos'?S.pf:S.user;r.prioridad='Media'}
  if(el.dataset.fecha&&col==='tareas'&&S.view!=='planner')r.fecha=el.dataset.fecha;
  openForm(col,r)},
 edit(el){const r=byId(el.dataset.col,el.dataset.id);if(r)openForm(el.dataset.col,JSON.parse(JSON.stringify(r)))},
 async 'f-save'(){const{col}=S.form;const r=readForm(col);if(typeof r==='string'){$('#ferr').textContent=r;return}
  if(col==='proyectos'&&r.estado==='Terminado'&&!(r.avance>=100))r.avance=100;
  $('#ov').hidden=true;S.form=null;await save(col,r);toast('Guardado')},
 'f-del'(el){if(!el.dataset.sure){el.dataset.sure=1;el.textContent='¿Seguro? Eliminar definitivamente';return}const{col,rec}=S.form;$('#ov').hidden=true;S.form=null;del(col,rec.id);toast('Eliminado')},
 close(){closeModal()},
 copy(){const t=$('#csvt');t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('Copiado'),()=>toast('Selecciona y copia con Ctrl+C'))}catch(_){toast('Selecciona y copia con Ctrl+C')}},
 pill(el){const{col,id,k}=el.dataset,r=byId(col,id);if(!r)return;openMenu(el,OPT[k],v=>{const n={...r,[k]:v};if(k==='estado'&&v==='Terminado')n.avance=100;save(col,n)})},
 'm-pick'(el){const cb=S.menuCb;closeMenu();cb&&cb(el.dataset.v)},
 done(el){const r=byId('tareas',el.dataset.id);if(r)save('tareas',{...r,hecha:el.checked})},
 grp(el){S.closed[el.dataset.g]=!S.closed[el.dataset.g];render()},
 'acc-prev'(){S.acc=new Date(S.acc.getFullYear(),S.acc.getMonth()-1,1);render()},
 'acc-next'(){S.acc=new Date(S.acc.getFullYear(),S.acc.getMonth()+1,1);render()},
 'acc-t'(el){S.accT=el.dataset.v;render()},
 'cal-prev'(){S.cal=new Date(S.cal.getFullYear(),S.cal.getMonth()-1,1);render()},
 'cal-next'(){S.cal=new Date(S.cal.getFullYear(),S.cal.getMonth()+1,1);render()},
 'cal-today'(){S.cal=new Date();render()},
 'pm'(el){S.pm=el.dataset.v;render()},
 'wk-prev'(){S.wk=addD(S.wk,-7);render()},'wk-next'(){S.wk=addD(S.wk,7);render()},'wk-today'(){S.wk=monday(new Date());render()},
 'pmm-prev'(){S.pmM=new Date(S.pmM.getFullYear(),S.pmM.getMonth()-1,1);render()},'pmm-next'(){S.pmM=new Date(S.pmM.getFullYear(),S.pmM.getMonth()+1,1);render()},
 'csv-open'(){csvDialog()},
 'csv-cal'(){const rows=calCSV($('#cr').value,$('#ce').checked);if(rows.length<2){toast('No hay eventos en ese periodo');return}$('#ov').hidden=true;download(`altia-calendario-${today()}.csv`,toCSV(rows))},
 'csv-acc'(){const m=iso(S.acc).slice(0,7),L=S.data.movimientos.filter(x=>(x.fecha||'').startsWith(m)).sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''));if(!L.length){toast('No hay movimientos este mes');return}
  download(`altia-contabilidad-${m}.csv`,'﻿'+toCSV([['Fecha','Concepto','Tipo','Categoría','Método','Estado','Cliente','Proyecto','Monto'],...L.map(x=>[x.fecha,x.concepto,x.tipo,x.categoria||'',x.metodo||'',x.pago||'',cname(x.cliente),pname(x.proyecto),(x.tipo==='Egreso'?-1:1)*(+x.monto||0)])]))},
 'csv-contacts'(){const L=S.data.clientes;if(!L.length){toast('No hay clientes');return}
  download(`altia-contactos-${today()}.csv`,toCSV([['Name','Organization 1 - Name','E-mail 1 - Value','Phone 1 - Value','Address 1 - Formatted','Notes','Group Membership'],...L.map(c=>[c.contacto||c.nombre,c.nombre,c.email||'',c.telefono||'',[c.direccion,c.ciudad].filter(Boolean).join(', '),c.notas||'','Clientes ALTIA ::: * myContacts'])]))},
 'map-pre'(el){S.vb=vbOf(PRE[el.dataset.v]);drawMap()},
 'map-z'(el){const v=S.vb;zoomAt({x:v.x+v.w/2,y:v.y+v.h/2},+el.dataset.v)},
 'map-fit'(){const P=S.data.clientes.filter(c=>c.lat!=null&&c.lng!=null);if(!P.length){S.vb=vbOf(PRE.mic);drawMap();return}
  const la=P.map(c=>c.lat),lo=P.map(c=>c.lng),pd=.02+.1*(Math.max(...lo)-Math.min(...lo)+Math.max(...la)-Math.min(...la));S.vb=vbOf([Math.min(...lo)-pd,Math.min(...la)-pd,Math.max(...lo)+pd,Math.max(...la)+pd]);drawMap()},
 'map-sel'(el){S.sel=el.dataset.id===S.sel?null:el.dataset.id;render()},
 'map-go'(el){const c=byId('clientes',el.dataset.id);if(!c)return;S.sel=c.id;const w=Math.min(S.vb?.w||.35,.35),h=w*.62;S.vb={x:c.lng*K-w/2,y:-c.lat-h/2,w,h};if(S.view!=='mapa')location.hash='#mapa';else render()},
 pickmap(){const r=readForm('clientes');const rec=typeof r==='string'?{...S.form.rec}:r;S.pick={rec};$('#ov').hidden=true;S.form=null;if(rec.lat!=null){const w=.05;S.vb={x:rec.lng*K-w/2,y:-rec.lat-w*.31,w,h:w*.62}}else if(!S.vb)S.vb=vbOf(PRE.mor);if(S.view!=='mapa')location.hash='#mapa';else render()},
 'pick-cancel'(){const r=S.pick.rec;S.pick=null;render();openForm('clientes',r)},
 sample(el){el.disabled=true;loadSample()},
 unsample(el){if(!el.dataset.sure){el.dataset.sure=1;el.textContent='¿Seguro? Borrar todos los ejemplos';return}el.disabled=true;clearSample()}
};
document.addEventListener('click',e=>{
 if($('#menu')&&!e.target.closest('#menu')&&!e.target.closest('[data-act="pill"]'))closeMenu();
 const t=e.target.closest('[data-act]');if(!t)return;
 if(t.closest('svg')&&t.dataset.act==='map-sel'&&S.pick)return;
 const f=A[t.dataset.act];if(f){if(t.tagName!=='INPUT')e.preventDefault();e.stopPropagation();f(t,e)}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if($('#menu'))closeMenu();else if(!$('#ov').hidden)closeModal()}
 if((e.key==='Enter'||e.key===' ')&&e.target.matches('.cal .d')){e.preventDefault();A.new(e.target)}
});
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeModal()});
/* arrastrar tareas */
let dragId=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.task[data-tid]');if(!c)return;dragId=c.dataset.tid;try{e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move'}catch(_){}});
document.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('[data-day]');if(!z||!dragId)return;e.preventDefault();$$('.drop').forEach(x=>x!==z&&x.classList.remove('drop'));z.classList.add('drop')});
document.addEventListener('dragend',()=>{dragId=null;$$('.drop').forEach(x=>x.classList.remove('drop'))});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('[data-day]');if(!z||!dragId)return;e.preventDefault();const r=byId('tareas',dragId);dragId=null;if(r&&(r.fecha||'')!==z.dataset.day)save('tareas',{...r,fecha:z.dataset.day});else render()});
$('#q').addEventListener('input',e=>{S.q=e.target.value.trim();render()});
$('#lf').addEventListener('submit',async e=>{e.preventDefault();const u=$('input[name=u]:checked').value,p=$('#lp').value,btn=$('#lf button[type=submit]');
 if(!sb){$('#lerr').textContent='No se pudo cargar la conexión con Supabase. Revisa tu internet y recarga.';return}
 btn.disabled=true;btn.textContent='Entrando…';
 const{error}=await sb.auth.signInWithPassword({email:EMAILS[u],password:p});
 btn.disabled=false;btn.textContent='Entrar';
 if(error){$('#lerr').textContent=/confirm/i.test(error.message)?'La cuenta aún no está confirmada en Supabase.':/fetch|network/i.test(error.message)||!error.status?'No hay conexión con Supabase. Revisa tu internet.':'Contraseña incorrecta. Intenta de nuevo.';$('#lp').select();return}
 $('#lerr').textContent='';startSession(u)});
addEventListener('hashchange',route);
setStatus();route();
(async()=>{if(!sb){S.mode='err';setStatus();return}try{const{data}=await sb.auth.getSession();const em=data.session&&data.session.user&&data.session.user.email;const u=Object.keys(EMAILS).find(k=>EMAILS[k]===em);if(u)startSession(u)}catch(_){}})();
}
